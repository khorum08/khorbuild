[package]
name = "khorvideo-v1"
version = "0.2.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "process", "io-util"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
